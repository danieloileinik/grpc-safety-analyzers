syntax = "proto3";

package safety.testing;
option csharp_namespace = "GrpcSafety.Analyzers.Tests.Fixtures";

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc ReadHello (HelloRequest) returns (HelloReply) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListHello (HelloRequest) returns (stream HelloReply);
  rpc UploadHello (stream HelloRequest) returns (HelloReply);
  rpc StreamHello (stream HelloRequest) returns (stream HelloReply);
}

service OtherGreeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
